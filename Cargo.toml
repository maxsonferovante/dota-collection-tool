[workspace]
resolver = "2"
members = ["crates/core", "crates/net", "crates/store", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/maxsonferovante/dota-collection-tool"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
